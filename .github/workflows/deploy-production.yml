name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Add VERCEL_DEPLOY_HOOK to GitHub repo secrets."
            echo "Create hook: Vercel dashboard → Project → Settings → Git → Deploy Hooks → main"
            exit 1
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK"
          echo "Production deploy triggered."
